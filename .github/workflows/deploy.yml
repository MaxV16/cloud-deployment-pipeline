name: build and deploy

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'set by Event')"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: log in to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mk758/cloud-deployment-pipeline:latest
            mk758/cloud-deployment-pipeline:${{ github.sha }}

      - name: register image update with pipecd
        continue-on-error: true
        uses: pipe-cd/actions-event-register@v1
        with:
          api-address: ${{ secrets.PIPECD_API_ADDRESS }}
          api-key: ${{ secrets.PIPECD_API_KEY }}
          event-name: image-update
          pipectl-version: v0.51.0
          labels: app=cloud-deployment-pipeline,env=production
          data: mk758/cloud-deployment-pipeline:${{ github.sha }}
