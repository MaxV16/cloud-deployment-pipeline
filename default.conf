server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Main static site
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Small dynamic endpoint so the page can show which pod served it.
    # $hostname is an nginx built-in variable = the container's hostname
    # (which in Kubernetes/OpenShift is the pod name).
    location = /api/host {
        default_type application/json;
        add_header Cache-Control "no-store";
        return 200 '{"hostname":"$hostname","version":"1.0.0"}';
    }

    # Health check endpoint (useful for OpenShift probes later)
    location = /healthz {
        default_type text/plain;
        return 200 'ok';
    }
}
